 if(pl){const cs=new Set(cur.map(l=>l.ncr));pl.filter(l=>!cs.has(l.ncr)).forEach(l=>{const b=mb(l);(by[b]=by[b]||{name:b,dn:0,da:0,on:0,oa:0}).dn++;by[b].da+=l.usd})}
 M.buyers=Object.values(by).map(r=>({...r,rate:pl?(r.dn+r.on?r.dn/(r.dn+r.on):0):null,share:A.tot[0]?r.on/A.tot[0]:0})).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
 M.doneKnown=!!pl;
 const sg={};cur.forEach(l=>{const g=sg[l.sup]=sg[l.sup]||{sup:l.sup,bs:new Set(),n:0,a:0,o90:0};g.bs.add(mb(l));g.n++;g.a+=l.usd;if(bucket(ageOf(l,sn.asof))===3)g.o90++});
 M.sup=Object.values(sg).map(g=>({sup:g.sup,b:[...g.bs].sort((a,b)=>a.localeCompare(b,'ko')).join(', '),n:g.n,a:g.a,o90:g.o90})).sort((a,b)=>b.a-a.a);
 const rg={};cur.filter(l=>l.st==='RTV').forEach(l=>{const g=rg[l.sup]=rg[l.sup]||{sup:l.sup,bs:new Set(),n:0,a:0};g.bs.add(mb(l));g.n++;g.a+=l.usd});
 M.rtv=Object.values(rg).map(g=>({sup:g.sup,b:[...g.bs].sort((a,b)=>a.localeCompare(b,'ko')).join(', '),n:g.n,a:g.a})).sort((a,b)=>b.a-a.a);
 M.tot={n:A.tot[0],a:A.tot[1]};M.o90={n:ag[3].n,a:ag[3].a};
 return M}

async function inflate(u8){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}

 for(let i=0;i<n;i++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);ent[new TextDecoder().decode(u8.subarray(p+46,p+46+nl))]={m,cs,lo};p+=46+nl+el+cl}
 return async name=>{const f=ent[name];if(!f)return null;const st=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true);const raw=u8.subarray(st,st+f.cs);return new TextDecoder().decode(f.m===0?raw:await inflate(raw))}}

const colIdx=r=>{let c=0;for(const ch of r.replace(/\d/g,''))c=c*26+ch.charCodeAt(0)-64;return c-1};
